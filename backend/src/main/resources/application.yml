spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospital_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema — Hibernate only validates
    show-sql: false
    open-in-view: false         # Avoid lazy-loading pitfalls in REST APIs
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

# CORS — frontend dev server
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    # 73-char secret = 584 bits — well above the HS256 minimum of 256 bits.
    # Override via JWT_SECRET env var in production.
    secret: ${JWT_SECRET:hospital-patient-mgmt-jwt-secret-key-minimum-256-bits-long-change-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 h
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000} # 7 days

logging:
  level:
    com.hospital: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
